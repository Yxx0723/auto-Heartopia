name: Offline tests and Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check active source names and imports
        run: python -m pyflakes utils tools
      - name: Run offline regression and architecture contracts
        run: python -m pytest tests personal_tests -o addopts= -q --junitxml=test-results.xml
      - name: Verify native EXE builds
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm packaging/HeartopiaMonitor.spec
